<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yowie Bicycle Workshop | Northern Beaches Bike Repairs</title>
    
    <link rel="stylesheet" href="./home_assets/site.3e67d0820f76a805afd5.css">

    <style>
        /* 1. FORCE VISIBILITY (Square CSS hides the body by default) */
        html, body { 
            visibility: visible !important; 
            opacity: 1 !important; 
            margin: 0; 
            padding: 0; 
            background: #1a1a1a; /* Dark background matches a pro workshop feel */
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        /* 2. THE HERO SECTION (The "Big Look") */
        .hero-banner {
            position: relative;
            height: 85vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #222;
            /* REPLIT/NETLIFY PATH: Change 'background.jpg' to your actual image name in home_files */
            background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('./home_files/background.jpg');
            background-size: cover;
            background-position: center;
            text-align: center;
            color: white;
        }

        .hero-content h1 {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            color: #ddb25e; /* Your Yowie Gold */
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        .hero-content p {
            font-size: 1.2rem;
            max-width: 600px;
            margin: 20px auto;
            line-height: 1.6;
            color: #eee;
        }

        /* 3. THE BUTTON (Matching your original style) */
        .btn-booking {
            display: inline-block;
            background: #ddb25e;
            color: white !important;
            padding: 18px 40px;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 2px;
            margin-top: 20px;
            transition: transform 0.2s;
        }
        .btn-booking:hover { transform: scale(1.05); background: #c9a154; }

        /* 4. HEADER/FOOTER */
        .nav-header { padding: 30px; text-align: center; background: white; }
        .nav-header a { color: #333; text-decoration: none; font-weight: bold; letter-spacing: 2px; }
        footer { padding: 80px 20px; text-align: center; color: #666; font-size: 0.9rem; background: white; }
    </style>
</head>
<body>

    <header class="nav-header">
        <a href="/">YOWIE BICYCLE WORKSHOP</a>
    </header>

    <section class="hero-banner">
        <div class="hero-content">
            <h1>Expert Bike Repairs</h1>
            <h3>North Narrabeen</h3>
            <p>Premium mechanical support for all types of bikes on the Northern Beaches.</p>
            <a href="mailto:hello@yowiebicycleworkshop.com.au" class="btn-booking">Book a Service</a>
        </div>
    </section>

    <footer>
        &copy; 2026 Yowie Bicycle Workshop - North Narrabeen, Sydney
    </footer>

</body>
</html>
