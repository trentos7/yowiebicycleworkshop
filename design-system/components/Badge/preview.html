<!doctype html>
<html>
<head>
<meta charset="UTF-8" />
<title>Badge — Yowie Design System</title>
<link rel="stylesheet" href="../../tokens.css" />
<style>
  body { margin: 0; padding: 32px; background: var(--bg); font-family: var(--font-sans); display: flex; flex-direction: column; gap: 20px; }
  .eyebrow { color: var(--accent); margin: 0; }
  .pill {
    display: inline-block;
    padding: 6px 14px;
    border-radius: var(--radius-pill);
    background: var(--accent);
    color: var(--on-accent);
    width: fit-content;
  }
</style>
</head>
<body>
  <p class="eyebrow ds-eyebrow">Northern Beaches Bicycle Workshop</p>
  <span class="pill ds-badge">Most Popular</span>
</body>
</html>
