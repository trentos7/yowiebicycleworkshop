<!doctype html>
<html>
<head>
<meta charset="UTF-8" />
<title>Card — Yowie Design System</title>
<link rel="stylesheet" href="../../tokens.css" />
<style>
  body { margin: 0; padding: 32px; background: var(--bg); font-family: var(--font-sans); }
  .card {
    max-width: 360px;
    padding: var(--space-5);
    background: var(--surface-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
  }
  .card h3 { margin: 0 0 8px; color: var(--text); }
  .card p { margin: 0; color: var(--muted); }
  ul.ticks { list-style: none; padding: 0; margin: 8px 0 0; }
  ul.ticks li { padding: 12px 0; border-bottom: 1px solid var(--border); color: var(--text); }
  ul.ticks li:last-child { border-bottom: 0; }
</style>
</head>
<body>
  <div class="card">
    <h3 class="ds-h3">Friendly local service</h3>
    <ul class="ticks ds-body">
      <li>Honest recommendations</li>
      <li>Repairs and servicing</li>
      <li>Mountain, road, E-bikes, commuter, and kids bikes</li>
    </ul>
  </div>
</body>
</html>
